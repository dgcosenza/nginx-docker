user abc;
include /config/nginx/worker_processes.conf;
pcre_jit on;
error_log /config/log/nginx/error.log;
include /etc/nginx/modules/*.conf;
include /etc/nginx/conf.d/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    include /config/nginx/resolver.conf;
    include /config/nginx/real-ip.conf;

    server_tokens off;
    client_max_body_size 0;
    sendfile on;
    tcp_nopush on;

    brotli on;
    brotli_comp_level 5;
    brotli_min_length 256;
    brotli_types text/plain text/css text/xml application/json application/javascript
                 application/xml application/xml+rss application/rss+xml text/javascript
                 image/svg+xml application/atom+xml font/ttf font/otf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss application/rss+xml text/javascript
               image/svg+xml application/atom+xml font/ttf font/otf;
    gzip_vary on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    access_log /config/log/nginx/access.log;

    include /etc/nginx/http.d/*.conf;
    include /config/nginx/site-confs/*.conf;
}

daemon off;
pid /run/nginx.pid;
