# Example Docker Compose configuration for dgcosenza/nginx
# Replace 192.0.2.10 with your host's LAN IP and pin by @sha256 digest in production.

services:
  nginx:
    image: dgcosenza/nginx:latest
    container_name: nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "192.0.2.10:443:443"
      # - "192.0.2.10:80:80"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - AUTO_RELOAD=true
    volumes:
      - ./config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' --max-time 5 https://127.0.0.1/ | grep -qE '^(200|301|302|401)$$'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
